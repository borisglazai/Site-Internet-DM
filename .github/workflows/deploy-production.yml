name: Deploy (production)

# Déclenchement MANUEL UNIQUEMENT (workflow_dispatch), volontairement, y
# compris à terme : la demande explicite est « production depuis main, avec
# validation contrôlée » — pas un déploiement automatique. Voir
# DEPLOYMENT_OUTSIDE_SITES.md.
#
# Recommandé en plus du déclenchement manuel : configurer l'environnement
# GitHub "production" avec des "required reviewers" (Settings → Environments
# → production → Deployment protection rules), pour qu'une approbation
# humaine soit nécessaire avant que ce job ne s'exécute réellement, même
# lancé manuellement.
#
# Ce workflow n'a encore jamais été exécuté par cette phase. Ne rien
# déclencher avant d'avoir suivi DEPLOYMENT_OUTSIDE_SITES.md en entier,
# validé sur staging, et confirmé les valeurs D1/R2 de production (celles
# déjà utilisées par ChatGPT Sites — jamais de nouvelles ressources vides,
# voir ENVIRONMENTS.md).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Tapez "deploy" pour confirmer un déploiement en production'
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare deploy config for production
        run: node scripts/deploy-config.mjs
        env:
          CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
          CF_D1_DATABASE_NAME: ${{ vars.CF_D1_DATABASE_NAME }}
          CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
          CF_R2_BUCKET_NAME: ${{ vars.CF_R2_BUCKET_NAME }}
          CF_ROUTE_PATTERN: ${{ vars.CF_ROUTE_PATTERN }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.deploy.json
