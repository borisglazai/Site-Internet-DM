name: Deploy (staging)

# Déclenchement MANUEL UNIQUEMENT (workflow_dispatch) pour l'instant : cette
# phase prépare le déploiement hors Sites sans en activer l'automatisme.
# Voir DEPLOYMENT_OUTSIDE_SITES.md.
#
# Pour obtenir l'objectif final (« déploiement automatique depuis la branche
# staging »), une fois ce déploiement manuel validé au moins une fois,
# remplacer le déclencheur ci-dessous par :
#   on:
#     push:
#       branches: [staging]
#
# Prérequis avant la première exécution (voir ENVIRONMENTS.md et
# DEPLOYMENT_OUTSIDE_SITES.md) : créer l'environnement GitHub "staging" avec
# les secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID, et les variables
# CF_WORKER_NAME / CF_D1_DATABASE_NAME / CF_D1_DATABASE_ID / CF_R2_BUCKET_NAME
# (+ CF_ROUTE_PATTERN optionnel), ainsi que le secret ADMIN_EMAILS posé
# directement sur le Worker via `wrangler secret put` (jamais ici).

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare deploy config for staging
        run: node scripts/deploy-config.mjs
        env:
          CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
          CF_D1_DATABASE_NAME: ${{ vars.CF_D1_DATABASE_NAME }}
          CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
          CF_R2_BUCKET_NAME: ${{ vars.CF_R2_BUCKET_NAME }}
          CF_ROUTE_PATTERN: ${{ vars.CF_ROUTE_PATTERN }}
          CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
          CF_ACCESS_AUD: ${{ vars.CF_ACCESS_AUD }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.deploy.json
